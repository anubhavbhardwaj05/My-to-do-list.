<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO DO LIST | Anubhav Bhardwaj</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/bootstrap.css">

</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-5 mt-5 mx-auto">
                <h2 class="mt-3">TO-DO-LIST</h2>
                <input type="text" placeholder="Enter your task" class="form-control" id="usertast" required>
                <button class="btn my-3" onclick="add()">ADD</button>
                <ul id="taskadd" class="text-white mt-3"></ul>
            </div>
           <p class="d-flex justify-content-center align-items-center text-center mt-4 text-light">
    created by <span style="color: rgb(25, 165, 208); font-weight: bold; margin-left: 5px;"> Anubhav Bhardwaj....</span>
</p>
        </div>
    </div>
    <script>


        window.onload = function () {
            let savedtask = JSON.parse(localStorage.getItem("task")) || [];
            savedtask.forEach(t => addtaskToUI(t));
        };


        function add() {
            // alert("Hellow");
            let inputbox = document.getElementById("usertast");
            let uservalue = inputbox.value;
            if (uservalue === "") {
                alert("Please Inter Your Task")
            }
            else {

                addtaskToUI(uservalue);
                let savedtask = JSON.parse(localStorage.getItem("task")) || []; // localstorage per add karne ke liye 
                savedtask.push(uservalue);
                localStorage.setItem("task", JSON.stringify(savedtask));

                inputbox.value = "";
            }
        }


        // alert("Your task added: " + uservalue);
        function addtaskToUI(taktext) {
            let li = document.createElement("li");
            li.innerText = taktext + "";

            let btn = document.createElement("button");
            btn.innerText = "Remove";
            btn.className = "btn btn-danger btn-sm ms-2 mb-2";


            btn.onclick = () => {
                li.remove();
                let savedtask = JSON.parse(localStorage.getItem("task")) || [];
                savedtask = savedtask.filter(t => t !== taktext);
                localStorage.setItem("task", JSON.stringify(savedtask));
            };

            li.appendChild(btn);
            document.getElementById("taskadd").appendChild(li);
        }
    </script>
    <script src="/js/bootstrap.bundle.js"></script>
</body>

</html>
